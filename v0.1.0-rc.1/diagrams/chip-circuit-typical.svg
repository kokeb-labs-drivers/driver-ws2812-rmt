<text x="32" y="1067.5" font-size="12.5" fill="#566070">* Not confirmed in the datasheet: U3: general practice: the data sheet draws no supply switch; pick one rated above the strip current; U4: general</text>
<text x="32" y="1085.5" font-size="12.5" fill="#566070">practice: the data sheet draws no level shifter; the HCT input accepts a 3.3 V output; R1 330 Ω: series resistor next to the first pixel: practice, 300</text>
<text x="32" y="1103.5" font-size="12.5" fill="#566070">to 500 ohm; R2 10 kΩ: pull-down on the data line: practice; the MCU pin floats from reset until the RMT starts.</text>
