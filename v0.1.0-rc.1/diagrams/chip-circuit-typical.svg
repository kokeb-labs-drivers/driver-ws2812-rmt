<svg xmlns="http://www.w3.org/2000/svg" width="984" height="1138" viewBox="0 0 984 1138" role="img" aria-labelledby="chip-circuit-typical-title chip-circuit-typical-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="chip-circuit-typical-title">WS2812B: Typical application</title>
<desc id="chip-circuit-typical-desc">Schematic of the WS2812B typical application: the chip with U2 MCU, U3 Load switch, U4 74HCT buffer, J1 5 V supply, R1 resistor 330 Ω, C1 capacitor 100 nF, R2 resistor 10 kΩ; the MCU wires carry the port hooks GpioSet(CtrlPin::Power), Transmit().</desc>
<rect x="0.5" y="0.5" width="983" height="1137" rx="16" fill="#FFFFFF" stroke="#E2E7EE"/>
<text x="32" y="44" font-size="12.5" font-weight="700" letter-spacing="1.2" fill="#7A360E">HARDWARE</text>
<text x="32" y="77.3" font-size="26" font-weight="700" fill="#0E1726">WS2812B: Typical application</text>
<text x="32" y="103.8" font-size="15" fill="#566070">One pixel of a strip on a 5 V supply, driven by a 3.3 V MCU. The MCU's GPIO only enables a load switch that feeds the</text>
<text x="32" y="125.5" font-size="15" fill="#566070">strip, so the pin never carries the strip current and never touches the pixel supply. The data pin goes through a</text>
<text x="32" y="147.3" font-size="15" fill="#566070">74HCT-class buffer on the switched 5 V and a 330 ohm resistor next to the first pixel, and a 100 nF capacitor decouples</text>
<text x="32" y="169.1" font-size="15" fill="#566070">VDD. A 10 kohm pull-down on the buffer input holds the data line low from MCU reset until the RMT channel drives it. The</text>
<text x="32" y="190.8" font-size="15" fill="#566070">MCU data pin idles low whenever the strip is off, so the buffer input is never driven while its supply is off. Above each</text>
<text x="32" y="212.6" font-size="15" fill="#566070">MCU wire: the port hook that drives it. Datasheet: Typical application circuit, p. 5.</text>
<rect x="32" y="228.6" width="920" height="1" fill="#E2E7EE"/>
