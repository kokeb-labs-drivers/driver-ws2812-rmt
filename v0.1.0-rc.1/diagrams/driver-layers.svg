<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="969" viewBox="0 0 1200 969" role="img" aria-labelledby="driver-layers-title driver-layers-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="driver-layers-title">The layers, one of them yours</title>
<desc id="driver-layers-desc">Layer diagram: your application calls the Ws2812Rmt core, which sends whole frames of pixel bytes through the GPIO port contract to the port class you write, which drives the chip; the core and the contract are the same on every MCU.</desc>
<defs><marker id="fk-arrow-rail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8893A2"/></marker></defs>
<rect x="0.5" y="0.5" width="1199" height="968" rx="16" fill="#FFFFFF" stroke="#E2E7EE"/>
<text x="32" y="46.8" font-size="16" font-weight="700" letter-spacing="1.2" fill="#7A360E">ARCHITECTURE</text>
<text x="32" y="85.6" font-size="32" font-weight="700" fill="#0E1726">The layers, one of them yours</text>
<text x="32" y="115.4" font-size="18" fill="#566070">Each arrow is a call. Only the port changes from one MCU to the next.</text>
<rect x="32" y="131.4" width="1136" height="1" fill="#E2E7EE"/>
<rect x="32" y="302.4" width="796" height="146.2" rx="16" fill="#FBEFE6" stroke="#E9C3A6" stroke-width="1.2"/>
<path d="M430 242.4 L430 298.4" fill="none" stroke="#8893A2" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#fk-arrow-rail)"/>
<path d="M430 452.6 L430 508.6" fill="none" stroke="#8893A2" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#fk-arrow-rail)"/>
<path d="M430 605.6 L430 661.6" fill="none" stroke="#8893A2" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#fk-arrow-rail)"/>
<path d="M430 757.6 L430 813.6" fill="none" stroke="#8893A2" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#fk-arrow-rail)"/>
<rect x="32" y="149.4" width="796" height="89" rx="12" fill="#E6F6F4" stroke="#0B7A72" stroke-width="1.4"/>
<rect x="32" y="157.4" width="4" height="73" rx="2" fill="#0B7A72"/>
<rect x="32" y="512.6" width="796" height="89" rx="12" fill="#FBEFE6" stroke="#9A4A17" stroke-width="1.4"/>
<rect x="32" y="520.6" width="4" height="73" rx="2" fill="#9A4A17"/>
<rect x="32" y="665.6" width="796" height="88" rx="12" fill="#E6F6F4" stroke="#0B7A72" stroke-width="1.4"/>
<rect x="32" y="673.6" width="4" height="72" rx="2" fill="#0B7A72"/>
<rect x="32" y="817.6" width="796" height="89" rx="12" fill="#F1F4F8" stroke="#64748B" stroke-width="1.4"/>
<rect x="32" y="825.6" width="4" height="73" rx="2" fill="#64748B"/>
<rect x="868" y="302.4" width="300" height="128.3" rx="12" fill="#FBEFE6" stroke="#E9C3A6" stroke-width="1"/>
<rect x="868" y="665.6" width="300" height="103.6" rx="12" fill="#E6F6F4" stroke="#A6DCD5" stroke-width="1"/>
<text x="56" y="184.4" font-size="20" font-weight="700" fill="#0B5F59">Your application</text>
<text x="56" y="215" font-size="17" fill="#2B3442">a handler, a manager or a test</text>
<rect x="48" y="370.6" width="167" height="26" rx="13" fill="#FBEFE6" stroke="#E9C3A6" stroke-width="1"/>
<text x="56" y="388.7" font-size="16" font-weight="700" fill="#7A360E">EnsureInitialized()</text>
<rect x="223" y="370.6" width="96.3" height="26" rx="13" fill="#FBEFE6" stroke="#E9C3A6" stroke-width="1"/>
<text x="231" y="388.7" font-size="16" font-weight="700" fill="#7A360E">SetPixel()</text>
<rect x="327.3" y="370.6" width="98" height="26" rx="13" fill="#FBEFE6" stroke="#E9C3A6" stroke-width="1"/>
<text x="335.3" y="388.7" font-size="16" font-weight="700" fill="#7A360E">GetPixel()</text>
<rect x="433.3" y="370.6" width="75.3" height="26" rx="13" fill="#FBEFE6" stroke="#E9C3A6" stroke-width="1"/>
<text x="441.3" y="388.7" font-size="16" font-weight="700" fill="#7A360E">Show()</text>
<rect x="516.5" y="370.6" width="116.1" height="26" rx="13" fill="#FBEFE6" stroke="#E9C3A6" stroke-width="1"/>
<text x="524.5" y="388.7" font-size="16" font-weight="700" fill="#7A360E">TraceWire()</text>
<rect x="640.7" y="370.6" width="105.2" height="26" rx="13" fill="#FBEFE6" stroke="#E9C3A6" stroke-width="1"/>
<text x="648.7" y="388.7" font-size="16" font-weight="700" fill="#7A360E">PowerOn()</text>
<rect x="48" y="404.6" width="108.2" height="26" rx="13" fill="#FBEFE6" stroke="#E9C3A6" stroke-width="1"/>
<text x="56" y="422.7" font-size="16" font-weight="700" fill="#7A360E">PowerOff()</text>
<rect x="164.2" y="404.6" width="179.8" height="26" rx="13" fill="#FBEFE6" stroke="#E9C3A6" stroke-width="1"/>
<text x="172.2" y="422.7" font-size="16" font-weight="700" fill="#7A360E">CurrentWaveform()</text>
<rect x="352" y="404.6" width="144.5" height="26" rx="13" fill="#FBEFE6" stroke="#E9C3A6" stroke-width="1"/>
<text x="360" y="422.7" font-size="16" font-weight="700" fill="#7A360E">FrameTimeUs()</text>
<text x="48" y="331.4" font-size="17" font-weight="700" fill="#7A360E">HARDWARE-AGNOSTIC CORE</text>
<text x="48" y="354.6" font-size="16" fill="#7A360E">Ws2812Rmt, inc/ws2812_rmt.hpp</text>
<rect x="405.4" y="258.4" width="49.1" height="24" rx="12" fill="#FFFFFF"/>
<text x="430" y="276.2" font-size="16" font-weight="500" text-anchor="middle" fill="#566070">calls</text>
<text x="56" y="547.6" font-size="20" font-weight="700" fill="#7A360E">Port contract</text>
<text x="56" y="578.2" font-size="17" fill="#2B3442">GpioInterface&lt;YourPort&gt;: checked at compile time, no virtual calls</text>
<text x="56" y="700.6" font-size="20" font-weight="700" fill="#0B5F59">Your port</text>
<text x="56" y="729.8" font-size="16" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#2B3442">EnsureInitialized()  ResolutionHz()  Transmit()  DelayUs()</text>
<text x="56" y="852.6" font-size="20" font-weight="700" fill="#334155">Ws2812Rmt</text>
<text x="56" y="883.2" font-size="17" fill="#2B3442">the pixel chain, on one data wire</text>
<rect x="312.1" y="468.6" width="235.8" height="24" rx="12" fill="#FFFFFF"/>
<text x="430" y="486.4" font-size="16" font-weight="500" text-anchor="middle" fill="#566070">whole frames of pixel bytes</text>
<rect x="329.6" y="621.6" width="200.8" height="24" rx="12" fill="#FFFFFF"/>
<text x="430" y="639.4" font-size="16" font-weight="500" text-anchor="middle" fill="#566070">forwards to your hooks</text>
<rect x="324.6" y="773.6" width="210.8" height="24" rx="12" fill="#FFFFFF"/>
<text x="430" y="791.4" font-size="16" font-weight="500" text-anchor="middle" fill="#566070">timed single-wire pulses</text>
<text x="886" y="337.4" font-size="20" font-weight="700" fill="#7A360E">Shared</text>
<text x="886" y="360.8" font-size="17" fill="#7A360E">The core and the contract are</text>
<text x="886" y="385.5" font-size="17" fill="#7A360E">the same code on every MCU</text>
<text x="886" y="410.1" font-size="17" fill="#7A360E">and on the host.</text>
<text x="886" y="700.6" font-size="20" font-weight="700" fill="#0B5F59">Yours</text>
<text x="886" y="724.1" font-size="17" fill="#0B5F59">One small class per MCU or</text>
<text x="886" y="748.7" font-size="17" fill="#0B5F59">board.</text>
<rect x="32" y="919" width="14" height="14" rx="4" fill="#E6F6F4" stroke="#0B7A72" stroke-width="1.4"/>
<text x="54" y="933.6" font-size="16" fill="#566070">you write</text>
<rect x="152.3" y="919" width="14" height="14" rx="4" fill="#FBEFE6" stroke="#9A4A17" stroke-width="1.4"/>
<text x="174.3" y="933.6" font-size="16" fill="#566070">this library</text>
<rect x="282.1" y="919" width="14" height="14" rx="4" fill="#F1F4F8" stroke="#64748B" stroke-width="1.4"/>
<text x="304.1" y="933.6" font-size="16" fill="#566070">hardware</text>
<path d="M404.1 927L434.1 927" fill="none" stroke="#8893A2" stroke-width="2.2" marker-end="url(#fk-arrow-rail)"/>
<text x="448.1" y="933.6" font-size="16" fill="#566070">calls</text>
</svg>
