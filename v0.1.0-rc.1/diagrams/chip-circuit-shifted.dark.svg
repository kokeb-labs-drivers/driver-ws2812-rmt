<svg xmlns="http://www.w3.org/2000/svg" width="888" height="780" viewBox="0 0 888 780" role="img" aria-labelledby="chip-circuit-shifted-title chip-circuit-shifted-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="chip-circuit-shifted-title">WS2812B: Level shifter for a 3.3 V MCU, supply always on</title>
<desc id="chip-circuit-shifted-desc">Schematic of the WS2812B level shifter for a 3.3 v mcu, supply always on: the chip with U2 MCU, U4 74HCT buffer, R1 resistor 330 Ω, C1 capacitor 100 nF, R2 resistor 10 kΩ; the MCU wires carry the port hooks GpioSet(CtrlPin::Power), Transmit().</desc>
<rect x="0.5" y="0.5" width="887" height="779" rx="16" fill="#0E131A" stroke="#283241"/>
<text x="32" y="44" font-size="12.5" font-weight="700" letter-spacing="1.2" fill="#F8D27A">HARDWARE</text>
<text x="32" y="77.3" font-size="26" font-weight="700" fill="#E8EDF3">WS2812B: Level shifter for a 3.3 V MCU, supply always on</text>
<text x="32" y="103.8" font-size="15" fill="#9AA6B5">The same data path when the strip supply is not switched: the 3.3 V data pin of the MCU through a</text>
<text x="32" y="125.5" font-size="15" fill="#9AA6B5">74HCT-class buffer powered from the same 5 V as the pixel, so the pixel sees a full 5 V high level, then the</text>
<text x="32" y="147.3" font-size="15" fill="#9AA6B5">330 ohm series resistor next to the first pixel. A 10 kohm pull-down on the buffer input holds the line low</text>
<text x="32" y="169.1" font-size="15" fill="#9AA6B5">while the MCU pin floats (from reset until the RMT channel starts), so the always-on pixels see no noise as</text>
<text x="32" y="190.8" font-size="15" fill="#9AA6B5">data. Above each MCU wire: the port hook that drives it. Datasheet: Electrical Characteristics, p. 2.</text>
<rect x="32" y="206.8" width="824" height="1" fill="#252F3C"/>
