<text x="32" y="709.8" font-size="12.5" fill="#9AA6B5">* Not confirmed in the datasheet: U4: general practice: the data sheet draws no level shifter; the HCT input accepts a 3.3 V output;</text>
<text x="32" y="727.8" font-size="12.5" fill="#9AA6B5">R1 330 Ω: series resistor next to the first pixel: practice, 300 to 500 ohm; R2 10 kΩ: pull-down on the data line: practice; the MCU pin</text>
<text x="32" y="745.8" font-size="12.5" fill="#9AA6B5">floats from reset until the RMT starts.</text>
