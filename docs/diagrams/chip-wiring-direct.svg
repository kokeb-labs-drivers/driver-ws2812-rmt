<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="634" viewBox="0 0 1200 634" role="img" aria-labelledby="chip-wiring-direct-title chip-wiring-direct-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="chip-wiring-direct-title">Wiring: Direct data line</title>
<desc id="chip-wiring-direct-desc">Wiring of the WS2812B for the Direct data line: MCU RMT data to DIN through R1 330 Ω (Transmit()). Supplies, grounds and the support parts are listed under the drawing.</desc>
<rect x="0.5" y="0.5" width="1199" height="633" rx="16" fill="#FFFFFF" stroke="#E2E7EE"/>
<text x="32" y="46.8" font-size="16" font-weight="700" letter-spacing="1.2" fill="#7A360E">PINS AND WIRING</text>
<text x="32" y="85.6" font-size="32" font-weight="700" fill="#0E1726">Wiring: Direct data line</text>
<text x="32" y="115.4" font-size="18" fill="#566070">What you connect by hand, with the driver hook on each MCU wire. The full schematic, with every part and value, is on the</text>
<text x="32" y="141.5" font-size="18" fill="#566070">Hardware page. Datasheet: Electrical Characteristics, p. 2.</text>
<rect x="32" y="157.5" width="1136" height="1" fill="#E2E7EE"/>
<path d="M478.6 280.3 L667.4 280.3" fill="none" stroke="#0B7A72" stroke-width="2.2"/>
<rect x="681.4" y="175.5" width="240" height="165.6" rx="10" fill="#F5F7FA" stroke="#2B3442" stroke-width="2.2"/>
<rect x="278.6" y="175.5" width="200" height="165.6" rx="12" fill="#EAF2FF" stroke="#2563EB" stroke-width="1.4"/>
<rect x="32" y="369.1" width="1136" height="79" rx="12" fill="#FFEEF2" stroke="#F5BECB" stroke-width="1"/>
<rect x="32" y="462.1" width="1136" height="79" rx="12" fill="#F1F4F8" stroke="#CBD5E1" stroke-width="1"/>
<text x="801.4" y="210.5" font-size="20" font-weight="700" text-anchor="middle" fill="#0E1726">WS2812B</text>
<text x="801.4" y="232.9" font-size="16" text-anchor="middle" fill="#566070">U1</text>
<text x="296.6" y="210.5" font-size="20" font-weight="700" fill="#1E429F">MCU</text>
<text x="296.6" y="232.9" font-size="16" fill="#1E429F">U2</text>
<text x="460.6" y="286.1" font-size="16" font-weight="600" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" text-anchor="end" fill="#1E429F">RMT data</text>
<text x="703.4" y="286.1" font-size="16" font-weight="700" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#0E1726">DIN</text>
<rect x="667.4" y="274.3" width="14" height="12" rx="2" fill="#E6F6F4" stroke="#0B7A72" stroke-width="1.4"/>
<text x="573" y="270.3" font-size="16" font-weight="600" text-anchor="middle" fill="#2B3442">DIN  pin 4</text>
<text x="573" y="303.1" font-size="16" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" text-anchor="middle" fill="#566070">Transmit()</text>
<text x="573" y="324.7" font-size="16" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" text-anchor="middle" fill="#566070">through R1 330 Ω</text>
<text x="50" y="404.1" font-size="20" font-weight="700" fill="#9F1239">Supplies and ground</text>
<text x="50" y="427.5" font-size="17" fill="#9F1239">+5V: VDD; also J1.5V · GND: VSS; also U2.GND, J1.GND</text>
<text x="50" y="497.1" font-size="20" font-weight="700" fill="#334155">Also on the board</text>
<text x="50" y="520.5" font-size="17" fill="#334155">Support parts: 1 capacitor, 1 resistor around the supplies (values in the full schematic). Not wired in this circuit (1): DOUT.</text>
<text x="32" y="566.6" font-size="16" fill="#566070">* Not confirmed in the datasheet: R1: series resistor next to the first pixel: practice, 300 to 500 ohm.</text>
<rect x="32" y="583.8" width="14" height="14" rx="4" fill="#E6F6F4" stroke="#0B7A72" stroke-width="1.4"/>
<text x="54" y="598.4" font-size="16" fill="#566070">digital in</text>
</svg>
