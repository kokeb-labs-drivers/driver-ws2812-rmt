<svg xmlns="http://www.w3.org/2000/svg" width="640" height="823" viewBox="0 0 640 823" role="img" aria-labelledby="single-wire-chain-title single-wire-chain-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="single-wire-chain-title">Pixels in a chain</title>
<desc id="single-wire-chain-desc">Chain of WS2812B pixels on one data wire: the MCU drives DIN of the first pixel, each DOUT drives the next DIN, and every pixel shares the VDD and VSS supply rails.</desc>
<defs><marker id="single-wire-chain-arrow-brand-strong" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#F4B942"/></marker></defs>
<rect x="0.5" y="0.5" width="639" height="822" rx="16" fill="#0E131A" stroke="#283241"/>
<text x="32" y="44.4" font-size="13" font-weight="700" letter-spacing="1.2" fill="#F8D27A">SEVERAL PIXELS</text>
<text x="32" y="76.2" font-size="24" font-weight="700" fill="#E8EDF3">Pixels in a chain</text>
<text x="32" y="102.7" font-size="15" fill="#9AA6B5">Datasheet: Data Transmission Method, p. 4; Cascade Method, p. 3;</text>
<text x="32" y="124.5" font-size="15" fill="#9AA6B5">Switching Characteristics, p. 3; Typical Application Circuit, p. 4.</text>
<rect x="32" y="140.4" width="576" height="1" fill="#252F3C"/>
<path d="M76 263.6 L76 304.6" fill="none" stroke="#F4B942" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#single-wire-chain-arrow-brand-strong)"/>
<path d="M76 384.6 L76 425.6" fill="none" stroke="#F4B942" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 5" marker-end="url(#single-wire-chain-arrow-brand-strong)"/>
<path d="M76 478.6 L76 519.6" fill="none" stroke="#F4B942" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 5" marker-end="url(#single-wire-chain-arrow-brand-strong)"/>
<path d="M541.2 194.6 L541.2 588.6" fill="none" stroke="#D2DAE4" stroke-width="2.2"/>
<path d="M493 323.6 L541.2 323.6" fill="none" stroke="#D2DAE4" stroke-width="1.8"/>
<path d="M493 452.1 L541.2 452.1" fill="none" stroke="#D2DAE4" stroke-width="1.8" stroke-dasharray="5 4"/>
<path d="M493 538.6 L541.2 538.6" fill="none" stroke="#D2DAE4" stroke-width="1.8"/>
<path d="M585.7 194.6 L585.7 588.6" fill="none" stroke="#D2DAE4" stroke-width="2.2"/>
<path d="M493 212.6 L585.7 212.6" fill="none" stroke="#D2DAE4" stroke-width="1.8"/>
<path d="M493 333.6 L585.7 333.6" fill="none" stroke="#D2DAE4" stroke-width="1.8"/>
<path d="M493 452.1 L585.7 452.1" fill="none" stroke="#D2DAE4" stroke-width="1.8" stroke-dasharray="5 4"/>
<path d="M493 548.6 L585.7 548.6" fill="none" stroke="#D2DAE4" stroke-width="1.8"/>
<rect x="32" y="186.6" width="461" height="74" rx="10" fill="#13233A" stroke="#60A5FA" stroke-width="1.4"/>
<rect x="32" y="194.6" width="4" height="58" rx="2" fill="#60A5FA"/>
<rect x="32" y="307.6" width="461" height="74" rx="10" fill="#0F2A28" stroke="#2BB3A3" stroke-width="1.4"/>
<rect x="32" y="315.6" width="4" height="58" rx="2" fill="#2BB3A3"/>
<rect x="32" y="428.6" width="461" height="47" rx="10" fill="#151C26" stroke="#6C7889" stroke-width="1" stroke-dasharray="6 4"/>
<rect x="32" y="522.6" width="461" height="74" rx="10" fill="#0F2A28" stroke="#2BB3A3" stroke-width="1.4"/>
<rect x="32" y="530.6" width="4" height="58" rx="2" fill="#2BB3A3"/>
<rect x="32" y="618.6" width="576" height="173.8" rx="10" fill="#1B232E" stroke="#3A4656" stroke-width="1"/>
<text x="52" y="215.1" font-size="17" font-weight="700" fill="#BFDBFE">MCU</text>
<text x="52" y="242.8" font-size="15" fill="#D2DAE4">RMT channel on one GPIO</text>
<text x="52" y="336.1" font-size="17" font-weight="700" fill="#A7F3E6">Pixel 1</text>
<text x="52" y="363.8" font-size="15" fill="#D2DAE4">takes the first 24 bits</text>
<text x="52" y="457.1" font-size="17" font-weight="700" fill="#E8EDF3">…</text>
<text x="52" y="551.1" font-size="17" font-weight="700" fill="#A7F3E6">Pixel N</text>
<text x="52" y="578.8" font-size="15" fill="#D2DAE4">takes the last 24 bits</text>
<text x="88" y="289.5" font-size="15" font-weight="600" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#D2DAE4">GPIO → DIN</text>
<text x="541.2" y="186.6" font-size="14" font-weight="700" text-anchor="middle" fill="#E8EDF3">VDD</text>
<circle cx="541.2" cy="323.6" r="3.6" fill="#D2DAE4"/>
<circle cx="541.2" cy="452.1" r="3.6" fill="#D2DAE4"/>
<circle cx="541.2" cy="538.6" r="3.6" fill="#D2DAE4"/>
<text x="585.7" y="186.6" font-size="14" font-weight="700" text-anchor="middle" fill="#E8EDF3">VSS</text>
<circle cx="585.7" cy="212.6" r="3.6" fill="#D2DAE4"/>
<circle cx="585.7" cy="333.6" r="3.6" fill="#D2DAE4"/>
<circle cx="585.7" cy="452.1" r="3.6" fill="#D2DAE4"/>
<circle cx="585.7" cy="548.6" r="3.6" fill="#D2DAE4"/>
<text x="46" y="647.1" font-size="17" font-weight="700" fill="#E2E8F0">Limits</text>
<text x="46" y="667.5" font-size="15" fill="#E2E8F0">The MCU sends D1; each pixel reshapes the rest and passes it on as D2,</text>
<text x="46" y="689.2" font-size="15" fill="#E2E8F0">D3, D4 (Cascade Method, p. 3). Each pixel keeps the first 24 bits it</text>
<text x="46" y="711" font-size="15" fill="#E2E8F0">receives and passes the rest on (Data Transmission Method, p. 4). DIN</text>
<text x="46" y="732.8" font-size="15" fill="#E2E8F0">to DOUT delay at most 300 ns (Switching Characteristics, p. 3). No extra</text>
<text x="46" y="754.5" font-size="15" fill="#E2E8F0">filter capacitor needed in the PCB layout (Typical Application Circuit, p.</text>
<text x="46" y="776.2" font-size="15" fill="#E2E8F0">4).</text>
</svg>
