<svg xmlns="http://www.w3.org/2000/svg" width="640" height="930" viewBox="0 0 640 930" role="img" aria-labelledby="single-wire-timing-title single-wire-timing-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" class="fk">
<title id="single-wire-timing-title">One wire, two codes and the reset</title>
<desc id="single-wire-timing-desc">Single-wire timing of the WS2812B V5: a 0 code is a short high and a long low, a 1 code a long high and a long low, and a low longer than the reset time latches the frame before the next one starts.</desc>
