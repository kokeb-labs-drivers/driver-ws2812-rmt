<text x="1041.4" y="210.5" font-size="20" font-weight="700" text-anchor="middle" fill="#E8EDF3">WS2812B</text>
<text x="1041.4" y="232.9" font-size="16" text-anchor="middle" fill="#9AA6B5">U1</text>
<text x="56.6" y="210.5" font-size="20" font-weight="700" fill="#BFDBFE">MCU</text>
<text x="56.6" y="232.9" font-size="16" fill="#BFDBFE">U2</text>
<text x="568.6" y="258.3" font-size="16" font-weight="700" fill="#DDD6FE">Load switch</text>
<text x="276.6" y="316.9" font-size="16" font-weight="600" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" text-anchor="end" fill="#BFDBFE">GPIO (supply enable)</text>
<text x="586.6" y="316.9" font-size="16" font-weight="600" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#DDD6FE">EN</text>
<text x="431.6" y="301.1" font-size="16" font-weight="600" text-anchor="middle" fill="#D2DAE4">Supply enable</text>
<text x="431.6" y="333.9" font-size="16" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" text-anchor="middle" fill="#9AA6B5">GpioSet(CtrlPin::Power)</text>
<text x="700.6" y="316.9" font-size="16" font-weight="600" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" text-anchor="end" fill="#DDD6FE">OUT</text>
