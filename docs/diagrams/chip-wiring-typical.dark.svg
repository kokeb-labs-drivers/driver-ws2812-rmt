<text x="276.6" y="441.3" font-size="16" font-weight="600" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" text-anchor="end" fill="#BFDBFE">RMT data</text>
<text x="586.6" y="441.3" font-size="16" font-weight="600" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#DDD6FE">A</text>
<text x="431.6" y="425.5" font-size="16" font-weight="600" text-anchor="middle" fill="#D2DAE4">RMT data</text>
<text x="431.6" y="458.3" font-size="16" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" text-anchor="middle" fill="#9AA6B5">+ R2 10 kΩ</text>
<text x="700.6" y="441.3" font-size="16" font-weight="600" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" text-anchor="end" fill="#DDD6FE">Y</text>
<text x="943.4" y="441.3" font-size="16" font-weight="700" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#E8EDF3">DIN</text>
<rect x="907.4" y="429.5" width="14" height="12" rx="2" fill="#0F2A28" stroke="#2BB3A3" stroke-width="1.4"/>
<text x="813" y="425.5" font-size="16" font-weight="600" text-anchor="middle" fill="#D2DAE4">DIN  pin 4</text>
<text x="813" y="458.3" font-size="16" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" text-anchor="middle" fill="#9AA6B5">Transmit()</text>
<text x="813" y="479.9" font-size="16" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" text-anchor="middle" fill="#9AA6B5">through R1 330 Ω</text>
<text x="50" y="567.3" font-size="20" font-weight="700" fill="#FECDD3">Supplies and ground</text>
<text x="50" y="590.8" font-size="17" fill="#FECDD3">+5V: VDD; also U3.OUT, U4.VCC · GND: VSS; also U2.GND, U3.GND, U4.GND, J1.GND</text>
<text x="50" y="660.3" font-size="20" font-weight="700" fill="#E2E8F0">Also on the board</text>
<text x="50" y="683.8" font-size="17" fill="#E2E8F0">Support parts: 1 capacitor, 2 resistors around the supplies (values in the full schematic). Not wired in this circuit (1): DOUT.</text>
<text x="32" y="729.8" font-size="16" fill="#9AA6B5">* Not confirmed in the datasheet: U3: general practice: the data sheet draws no supply switch; pick one rated above the strip current; U4:</text>
<text x="32" y="752.8" font-size="16" fill="#9AA6B5">general practice: the data sheet draws no level shifter; the HCT input accepts a 3.3 V output; R1: series resistor next to the first pixel:</text>
<text x="32" y="775.9" font-size="16" fill="#9AA6B5">practice, 300 to 500 ohm; R2: pull-down on the data line: practice; the MCU pin floats from reset until the RMT starts.</text>
