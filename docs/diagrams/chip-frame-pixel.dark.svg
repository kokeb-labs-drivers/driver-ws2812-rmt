<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="328" viewBox="0 0 1200 328" role="img" aria-labelledby="chip-frame-pixel-title chip-frame-pixel-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="chip-frame-pixel-title">WS2812B: Pixel data</title>
<desc id="chip-frame-pixel-desc">Pixel data of the WS2812B, 24 bits, most significant bit first. DIN: G7 to G0 (bits 23 to 16), R7 to R0 (bits 15 to 8), B7 to B0 (bits 7 to 0).</desc>
<rect x="0.5" y="0.5" width="1199" height="327" rx="16" fill="#0E131A" stroke="#283241"/>
<text x="32" y="46.8" font-size="16" font-weight="700" letter-spacing="1.2" fill="#F8D27A">ON THE BUS</text>
<text x="32" y="85.6" font-size="32" font-weight="700" fill="#E8EDF3">WS2812B: Pixel data</text>
<text x="32" y="115.4" font-size="18" fill="#9AA6B5">The first pixel keeps the first 24 bits on DIN, sent in the order G, R, B, high bit first, and forwards every bit after them on</text>
<text x="32" y="141.5" font-size="18" fill="#9AA6B5">DOUT. 24 bits, sent most significant bit first. Datasheet: Composition of 24bit Data, p. 4.</text>
<rect x="32" y="157.5" width="1136" height="1" fill="#252F3C"/>
<rect x="210" y="209.5" width="310" height="46" rx="6" fill="#11281A" stroke="#4ADE80" stroke-width="1.4"/>
<rect x="520" y="209.5" width="310" height="46" rx="6" fill="#2C2310" stroke="#FBBF24" stroke-width="1.4"/>
<rect x="830" y="209.5" width="310" height="46" rx="6" fill="#13233A" stroke="#60A5FA" stroke-width="1.4"/>
<text x="210" y="191.5" font-size="16" fill="#9AA6B5">MSB, sent first</text>
<text x="1140" y="191.5" font-size="16" text-anchor="end" fill="#9AA6B5">LSB, sent last</text>
<text x="32" y="230.5" font-size="20" font-weight="700" fill="#E8EDF3">DIN</text>
<text x="32" y="250.5" font-size="16" fill="#9AA6B5">first 24 bits</text>
<text x="365" y="238.6" font-size="17" font-weight="600" text-anchor="middle" fill="#BBF7D0">G7 to G0</text>
<text x="212" y="275.5" font-size="16" fill="#9AA6B5">23</text>
<text x="518" y="275.5" font-size="16" text-anchor="end" fill="#9AA6B5">16</text>
<text x="675" y="238.6" font-size="17" font-weight="600" text-anchor="middle" fill="#FDE68A">R7 to R0</text>
<text x="522" y="275.5" font-size="16" fill="#9AA6B5">15</text>
<text x="828" y="275.5" font-size="16" text-anchor="end" fill="#9AA6B5">8</text>
<text x="985" y="238.6" font-size="17" font-weight="600" text-anchor="middle" fill="#BFDBFE">B7 to B0</text>
<text x="832" y="275.5" font-size="16" fill="#9AA6B5">7</text>
<text x="1138" y="275.5" font-size="16" text-anchor="end" fill="#9AA6B5">0</text>
</svg>
