<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="924" viewBox="0 0 1200 924" role="img" aria-labelledby="chip-capabilities-title chip-capabilities-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="chip-capabilities-title">What the WS2812B does</title>
<desc id="chip-capabilities-desc">Capability map of the WS2812B: 24-bit pixel colour (supported): Stores the colours and sends each pixel as G, R, B, high bit first; the colour order is a Config field; Cascaded pixels (supported): Sends a whole strip in one frame: each pixel keeps its 24 bits and forwards the rest; Bit timing (supported): Turns the datasheet pulse windows into ticks of the rate your port really runs at, or refuses; Frame latch (supported): Ends a frame with a low longer than the reset time (above 280 µs on the V5 sheet) so the pixels latch; 256 brightness levels (supported): Scales the colours before sending, with an optional gamma table; the chip itself takes 8 bits per colour; Shared power source (supported): Logic and LEDs share one supply, so the driver can switch the strip's supply from an MCU pin; Other generations (supported): Timing windows for the WS2812 and WS2812B generations, WS2812C and D, and SK6812 parts, or a Custom timing; Input level (not covered): DIN needs at least 2.7 V on the V5 sheet; the driver cannot see the level, so a level shifter is yours.</desc>
