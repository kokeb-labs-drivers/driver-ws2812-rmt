---
# Driver metadata (handbook KB-REPO-018): kb-core's compatibility catalogue, the MCU gate, the kb tool and the
# configurator read it. CI checks name and version against cmake/ws2812_rmt_build_settings.cmake.
name: ws2812_rmt
version: 0.1.0
bus: [pio]           # spi, i2c, uart, adc, pio, gpio, can, canopen, modbus, onewire
mcus: [esp32]       # any, or the MCU families it needs, e.g. [esp32]
peripheral: rmt     # an MCU peripheral it needs with mcus, e.g. rmt
kb_core_min: null   # the oldest kb-core release whose handler works with this version; null until kb-core exists
authors: ["The driver-ws2812-rmt authors"]  # the copyright holder, as in LICENSE
