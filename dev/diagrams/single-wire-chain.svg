<svg xmlns="http://www.w3.org/2000/svg" width="640" height="823" viewBox="0 0 640 823" role="img" aria-labelledby="single-wire-chain-title single-wire-chain-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="single-wire-chain-title">Pixels in a chain</title>
<desc id="single-wire-chain-desc">Chain of WS2812B pixels on one data wire: the MCU drives DIN of the first pixel, each DOUT drives the next DIN, and every pixel shares the VDD and VSS supply rails.</desc>
<defs><marker id="single-wire-chain-arrow-brand-strong" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9A4A17"/></marker></defs>
<rect x="0.5" y="0.5" width="639" height="822" rx="16" fill="#FFFFFF" stroke="#E2E7EE"/>
<text x="32" y="44.4" font-size="13" font-weight="700" letter-spacing="1.2" fill="#7A360E">SEVERAL PIXELS</text>
<text x="32" y="76.2" font-size="24" font-weight="700" fill="#0E1726">Pixels in a chain</text>
<text x="32" y="102.7" font-size="15" fill="#566070">Datasheet: Data Transmission Method, p. 4; Cascade Method, p. 3;</text>
<text x="32" y="124.5" font-size="15" fill="#566070">Switching Characteristics, p. 3; Typical Application Circuit, p. 4.</text>
<rect x="32" y="140.4" width="576" height="1" fill="#E2E7EE"/>
<path d="M76 263.6 L76 304.6" fill="none" stroke="#9A4A17" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#single-wire-chain-arrow-brand-strong)"/>
<path d="M76 384.6 L76 425.6" fill="none" stroke="#9A4A17" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 5" marker-end="url(#single-wire-chain-arrow-brand-strong)"/>
<path d="M76 478.6 L76 519.6" fill="none" stroke="#9A4A17" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 5" marker-end="url(#single-wire-chain-arrow-brand-strong)"/>
<path d="M541.2 194.6 L541.2 588.6" fill="none" stroke="#2B3442" stroke-width="2.2"/>
<path d="M493 323.6 L541.2 323.6" fill="none" stroke="#2B3442" stroke-width="1.8"/>
<path d="M493 452.1 L541.2 452.1" fill="none" stroke="#2B3442" stroke-width="1.8" stroke-dasharray="5 4"/>
<path d="M493 538.6 L541.2 538.6" fill="none" stroke="#2B3442" stroke-width="1.8"/>
<path d="M585.7 194.6 L585.7 588.6" fill="none" stroke="#2B3442" stroke-width="2.2"/>
<path d="M493 212.6 L585.7 212.6" fill="none" stroke="#2B3442" stroke-width="1.8"/>
<path d="M493 333.6 L585.7 333.6" fill="none" stroke="#2B3442" stroke-width="1.8"/>
<path d="M493 452.1 L585.7 452.1" fill="none" stroke="#2B3442" stroke-width="1.8" stroke-dasharray="5 4"/>
<path d="M493 548.6 L585.7 548.6" fill="none" stroke="#2B3442" stroke-width="1.8"/>
<rect x="32" y="186.6" width="461" height="74" rx="10" fill="#EAF2FF" stroke="#2563EB" stroke-width="1.4"/>
<rect x="32" y="194.6" width="4" height="58" rx="2" fill="#2563EB"/>
<rect x="32" y="307.6" width="461" height="74" rx="10" fill="#E6F6F4" stroke="#0B7A72" stroke-width="1.4"/>
<rect x="32" y="315.6" width="4" height="58" rx="2" fill="#0B7A72"/>
<rect x="32" y="428.6" width="461" height="47" rx="10" fill="#FFFFFF" stroke="#738093" stroke-width="1" stroke-dasharray="6 4"/>
<rect x="32" y="522.6" width="461" height="74" rx="10" fill="#E6F6F4" stroke="#0B7A72" stroke-width="1.4"/>
<rect x="32" y="530.6" width="4" height="58" rx="2" fill="#0B7A72"/>
<rect x="32" y="618.6" width="576" height="173.8" rx="10" fill="#F1F4F8" stroke="#CBD5E1" stroke-width="1"/>
<text x="52" y="215.1" font-size="17" font-weight="700" fill="#1E429F">MCU</text>
<text x="52" y="242.8" font-size="15" fill="#2B3442">RMT channel on one GPIO</text>
<text x="52" y="336.1" font-size="17" font-weight="700" fill="#0B5F59">Pixel 1</text>
<text x="52" y="363.8" font-size="15" fill="#2B3442">takes the first 24 bits</text>
<text x="52" y="457.1" font-size="17" font-weight="700" fill="#0E1726">…</text>
<text x="52" y="551.1" font-size="17" font-weight="700" fill="#0B5F59">Pixel N</text>
<text x="52" y="578.8" font-size="15" fill="#2B3442">takes the last 24 bits</text>
<text x="88" y="289.5" font-size="15" font-weight="600" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#2B3442">GPIO → DIN</text>
<text x="541.2" y="186.6" font-size="14" font-weight="700" text-anchor="middle" fill="#0E1726">VDD</text>
<circle cx="541.2" cy="323.6" r="3.6" fill="#2B3442"/>
<circle cx="541.2" cy="452.1" r="3.6" fill="#2B3442"/>
<circle cx="541.2" cy="538.6" r="3.6" fill="#2B3442"/>
<text x="585.7" y="186.6" font-size="14" font-weight="700" text-anchor="middle" fill="#0E1726">VSS</text>
<circle cx="585.7" cy="212.6" r="3.6" fill="#2B3442"/>
<circle cx="585.7" cy="333.6" r="3.6" fill="#2B3442"/>
<circle cx="585.7" cy="452.1" r="3.6" fill="#2B3442"/>
<circle cx="585.7" cy="548.6" r="3.6" fill="#2B3442"/>
<text x="46" y="647.1" font-size="17" font-weight="700" fill="#334155">Limits</text>
<text x="46" y="667.5" font-size="15" fill="#334155">The MCU sends D1; each pixel reshapes the rest and passes it on as D2,</text>
<text x="46" y="689.2" font-size="15" fill="#334155">D3, D4 (Cascade Method, p. 3). Each pixel keeps the first 24 bits it</text>
<text x="46" y="711" font-size="15" fill="#334155">receives and passes the rest on (Data Transmission Method, p. 4). DIN</text>
<text x="46" y="732.8" font-size="15" fill="#334155">to DOUT delay at most 300 ns (Switching Characteristics, p. 3). No extra</text>
<text x="46" y="754.5" font-size="15" fill="#334155">filter capacitor needed in the PCB layout (Typical Application Circuit, p.</text>
<text x="46" y="776.2" font-size="15" fill="#334155">4).</text>
</svg>
