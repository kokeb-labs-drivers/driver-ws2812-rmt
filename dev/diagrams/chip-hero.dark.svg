<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="613" viewBox="0 0 1200 613" role="img" aria-labelledby="chip-hero-title chip-hero-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="chip-hero-title">WS2812B</title>
<desc id="chip-hero-desc">Overview of the WS2812B, an addressable RGB LED with its control circuit in one 5050 package: pixels chain on a single data wire, each keeps the first 24 bits it receives for its three LEDs and passes the rest on to the next pixel. A MCU talks to it over one data wire; it drives Red, green and blue LEDs, then Next pixel. Headline figures: 800 kbit/s data rate on one wire; 24 bit per pixel: G, R, B, 8 bits each; 256 brightness levels per colour; &gt; 280 µs low time that latches a frame.</desc>
