<svg xmlns="http://www.w3.org/2000/svg" width="984" height="569" viewBox="0 0 984 569" role="img" aria-labelledby="chip-circuit-direct-title chip-circuit-direct-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="chip-circuit-direct-title">WS2812B: Direct data line</title>
<desc id="chip-circuit-direct-desc">Schematic of the WS2812B direct data line: the chip with U2 MCU, J1 5 V supply, R1 resistor 330 Ω, C1 capacitor 100 nF; the MCU wires carry the port hooks GpioSet(CtrlPin::Power), Transmit().</desc>
<rect x="0.5" y="0.5" width="983" height="568" rx="16" fill="#0E131A" stroke="#283241"/>
<text x="32" y="44" font-size="12.5" font-weight="700" letter-spacing="1.2" fill="#F8D27A">HARDWARE</text>
<text x="32" y="77.3" font-size="26" font-weight="700" fill="#E8EDF3">WS2812B: Direct data line</text>
<text x="32" y="103.8" font-size="15" fill="#9AA6B5">The 3.3 V data pin of the MCU straight to DIN through a 330 ohm resistor next to the first pixel, with the pixel on a 5 V</text>
<text x="32" y="125.5" font-size="15" fill="#9AA6B5">supply and a 100 nF capacitor at VDD. This meets the V5.0 sheet's 2.7 V high level (and the 2025 V6 sheet's) but not the</text>
<text x="32" y="147.3" font-size="15" fill="#9AA6B5">sheets that ask for 0.63 x VDD; see Input level on the Hardware page. Above each MCU wire: the port hook that drives it.</text>
<text x="32" y="169.1" font-size="15" fill="#9AA6B5">Datasheet: Electrical Characteristics, p. 2.</text>
