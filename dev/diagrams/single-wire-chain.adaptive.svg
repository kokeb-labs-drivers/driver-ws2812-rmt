<path d="M493 333.6 L585.7 333.6" fill="none" stroke-width="1.8" class="fk-s-ink2"/>
<path d="M493 452.1 L585.7 452.1" fill="none" stroke-width="1.8" stroke-dasharray="5 4" class="fk-s-ink2"/>
<path d="M493 548.6 L585.7 548.6" fill="none" stroke-width="1.8" class="fk-s-ink2"/>
<rect x="32" y="186.6" width="461" height="74" rx="10" stroke-width="1.4" class="fk-f-blue-tint fk-s-blue-strong"/>
<rect x="32" y="194.6" width="4" height="58" rx="2" class="fk-f-blue-strong"/>
<rect x="32" y="307.6" width="461" height="74" rx="10" stroke-width="1.4" class="fk-f-teal-tint fk-s-teal-strong"/>
