<defs><marker id="single-wire-chain-arrow-brand-strong" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="fk-f-brand-strong"/></marker></defs>
<rect x="0.5" y="0.5" width="639" height="822" rx="16" class="fk-f-canvas fk-s-frame"/>
<text x="32" y="44.4" font-size="13" font-weight="700" letter-spacing="1.2" class="fk-f-brand-text">SEVERAL PIXELS</text>
<text x="32" y="76.2" font-size="24" font-weight="700" class="fk-f-ink">Pixels in a chain</text>
<text x="32" y="102.7" font-size="15" class="fk-f-muted">Datasheet: Data Transmission Method, p. 4; Cascade Method, p. 3;</text>
<text x="32" y="124.5" font-size="15" class="fk-f-muted">Switching Characteristics, p. 3; Typical Application Circuit, p. 4.</text>
<rect x="32" y="140.4" width="576" height="1" class="fk-f-hair"/>
<path d="M76 263.6 L76 304.6" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#single-wire-chain-arrow-brand-strong)" class="fk-s-brand-strong"/>
