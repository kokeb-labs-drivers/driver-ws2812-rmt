<rect x="32" y="428.6" width="461" height="47" rx="10" stroke-width="1" stroke-dasharray="6 4" class="fk-f-card fk-s-line"/>
<rect x="32" y="522.6" width="461" height="74" rx="10" stroke-width="1.4" class="fk-f-teal-tint fk-s-teal-strong"/>
<rect x="32" y="530.6" width="4" height="58" rx="2" class="fk-f-teal-strong"/>
<rect x="32" y="618.6" width="576" height="173.8" rx="10" stroke-width="1" class="fk-f-slate-tint fk-s-slate-soft"/>
<text x="52" y="215.1" font-size="17" font-weight="700" class="fk-f-blue-text">MCU</text>
<text x="52" y="242.8" font-size="15" class="fk-f-ink2">RMT channel on one GPIO</text>
<text x="52" y="336.1" font-size="17" font-weight="700" class="fk-f-teal-text">Pixel 1</text>
<text x="52" y="363.8" font-size="15" class="fk-f-ink2">takes the first 24 bits</text>
<text x="52" y="457.1" font-size="17" font-weight="700" class="fk-f-ink">…</text>
<text x="52" y="551.1" font-size="17" font-weight="700" class="fk-f-teal-text">Pixel N</text>
<text x="52" y="578.8" font-size="15" class="fk-f-ink2">takes the last 24 bits</text>
<text x="88" y="289.5" font-size="15" font-weight="600" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" class="fk-f-ink2">GPIO → DIN</text>
<text x="541.2" y="186.6" font-size="14" font-weight="700" text-anchor="middle" class="fk-f-ink">VDD</text>
<circle cx="541.2" cy="323.6" r="3.6" class="fk-f-ink2"/>
<circle cx="541.2" cy="452.1" r="3.6" class="fk-f-ink2"/>
<circle cx="541.2" cy="538.6" r="3.6" class="fk-f-ink2"/>
<text x="585.7" y="186.6" font-size="14" font-weight="700" text-anchor="middle" class="fk-f-ink">VSS</text>
<circle cx="585.7" cy="212.6" r="3.6" class="fk-f-ink2"/>
<circle cx="585.7" cy="333.6" r="3.6" class="fk-f-ink2"/>
<circle cx="585.7" cy="452.1" r="3.6" class="fk-f-ink2"/>
<circle cx="585.7" cy="548.6" r="3.6" class="fk-f-ink2"/>
<text x="46" y="647.1" font-size="17" font-weight="700" class="fk-f-slate-text">Limits</text>
<text x="46" y="667.5" font-size="15" class="fk-f-slate-text">The MCU sends D1; each pixel reshapes the rest and passes it on as D2,</text>
<text x="46" y="689.2" font-size="15" class="fk-f-slate-text">D3, D4 (Cascade Method, p. 3). Each pixel keeps the first 24 bits it</text>
<text x="46" y="711" font-size="15" class="fk-f-slate-text">receives and passes the rest on (Data Transmission Method, p. 4). DIN</text>
<text x="46" y="732.8" font-size="15" class="fk-f-slate-text">to DOUT delay at most 300 ns (Switching Characteristics, p. 3). No extra</text>
<text x="46" y="754.5" font-size="15" class="fk-f-slate-text">filter capacitor needed in the PCB layout (Typical Application Circuit, p.</text>
<text x="46" y="776.2" font-size="15" class="fk-f-slate-text">4).</text>
</svg>
